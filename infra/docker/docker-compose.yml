services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reckon
      POSTGRES_PASSWORD: reckon
      POSTGRES_DB: reckon
    ports:
      - "5432:5432"
    volumes:
      - reckon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reckon"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reckon:reckon@postgres:5432/reckon?schema=public
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  reckon_postgres_data:
