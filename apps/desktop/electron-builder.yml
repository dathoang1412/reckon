appId: com.reckon.desktop
productName: Reckon
directories:
  output: release
# Lets electron-updater (see main/app/updater.ts) find new releases —
# unauthenticated requests against public GitHub Releases, so this only
# works while the repo stays public. Explicit owner/repo rather than
# relying on package.json's "repository" field or git remote autodetection,
# since neither is set here.
publish:
  provider: github
  owner: dathoang1412
  repo: reckon
  # Deliberately left as a draft here (electron-builder's default) instead
  # of "release": un-drafting immediately makes the release + its assets
  # visible to electron-updater, but electron-builder uploads assets one at
  # a time (installer first, latest.yml last) — a user whose app happens to
  # check for updates in that gap gets a 404 fetching latest.yml. The
  # release.yml workflow's "Publish release" step un-drafts explicitly,
  # after every asset (and the release notes) has finished uploading.
  releaseType: draft
files:
  - out/**/*
  - generated/**/*
  - package.json
extraResources:
  - from: prisma/migrations
    to: prisma/migrations
  # Self-contained @reckon/server build (see root `pnpm bundle:server`),
  # spawned as a child process on app startup — src/main/services/server.ts.
  - from: server-bundle
    to: server
asarUnpack:
  - node_modules/.prisma/**/*
  - node_modules/@prisma/client/**/*
  - generated/client/**/*
  - node_modules/@nut-tree-fork/**/*
win:
  target: nsis
mac:
  target: dmg
linux:
  target: AppImage
