appId: com.reckon.desktop
productName: Reckon
directories:
  output: release
files:
  - out/**/*
  - generated/**/*
  - package.json
extraResources:
  - from: prisma/migrations
    to: prisma/migrations
  # Self-contained @reckon/server build (see root `pnpm bundle:server`),
  # spawned as a child process on app startup — src/main/server.ts.
  - from: server-bundle
    to: server
asarUnpack:
  - node_modules/.prisma/**/*
  - node_modules/@prisma/client/**/*
  - generated/client/**/*
  - node_modules/@nut-tree-fork/**/*
win:
  target: nsis
mac:
  target: dmg
linux:
  target: AppImage
