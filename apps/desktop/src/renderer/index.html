<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://upload.wikimedia.org; media-src 'self' data:"
    />
    <title>Reckon</title>
    <style>
      /* antd's own reset.css (which includes this) is never imported, so
         without this every plain element with both an explicit width and
         its own padding/border — e.g. the sidebar column in App.tsx
         (width:220 + paddingLeft:20) — silently renders WIDER than its
         stated width under the browser's content-box default, since
         padding/border add on top instead of eating into it. That
         mismatch between "what the layout math assumes" and "what
         actually renders" is what let the sidebar overflow off the
         window's right edge even at widths that should have been enough. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* Light is the default so a plain element (no data-theme set yet, or
         JS disabled) never flashes unstyled — main.tsx stamps
         data-theme="dark" onto <html> once it knows the saved preference
         (see theme.ts), and this block overrides every var below it. */
      :root {
        --bg: #ffffff;
        --text: #1f1f1f;
        --border: #f0f0f0;
        --hover-bg: #f5f6fa;
        --bubble-bg: #f0f0f0;
        --keycap-bg: #fafafa;
        --keycap-border: #d9d9d9;
        --keycap-border-bottom: #bfbfbf;
        --keycap-text: #333333;
        --chart-tooltip-bg: #ffffff;
        --chart-tooltip-shadow: rgba(0, 0, 0, 0.08);
        --chart-tick: #999999;
        --chart-cursor: rgba(0, 0, 0, 0.04);
        /* Categorical (FSRS review-state) chart series — validated with the
           data-viz skill's palette validator (adjacent-pair CVD/contrast
           checks) for the Stats page's state-distribution bar. */
        --fsrs-new: #2a78d6;
        --fsrs-learning: #eb6834;
        --fsrs-review: #1baf7a;
        --fsrs-relearning: #eda100;
      }
      :root[data-theme="dark"] {
        --bg: #16181d;
        --text: #e6e6e6;
        --border: #33363d;
        --hover-bg: #22252b;
        --bubble-bg: #262a31;
        --keycap-bg: #22252b;
        --keycap-border: #3a3d44;
        --keycap-border-bottom: #46494f;
        --keycap-text: #d9d9d9;
        --chart-tooltip-bg: #22252b;
        --chart-tooltip-shadow: rgba(0, 0, 0, 0.4);
        --chart-tick: #888888;
        --chart-cursor: rgba(255, 255, 255, 0.06);
        --fsrs-new: #3987e5;
        --fsrs-learning: #d95926;
        --fsrs-review: #199e70;
        --fsrs-relearning: #c98500;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        /* Every window manages its own scroll region internally (App's
           list, Popup's content div) — without this, a window whose
           content is even a pixel taller than its viewport shows a second,
           document-level scrollbar stacked next to the intentional one. */
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        /* antd's own reset.css (never imported, see box-sizing note above)
           is also what would normally put a sans-serif font on <body> —
           without this, any plain element outside an antd Typography
           component (e.g. ActivityChart.tsx's stat numbers) falls back to
           the browser's true CSS default, serif, instead of matching the
           rest of the app. Keep in sync with theme.ts's FONT_FAMILY. */
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          "Noto Sans",
          sans-serif,
          "Apple Color Emoji",
          "Segoe UI Emoji",
          "Segoe UI Symbol",
          "Noto Color Emoji";
      }

      /* Popup content fades in on each lookup instead of popping in
         instantly — the window itself is shown right after this mounts
         (see windows/popup.ts), so this is the first thing the user sees. */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .fade-in {
        animation: fadeIn 120ms ease-out;
      }

      .entry-row {
        transition: background-color 120ms ease-out;
      }
      .entry-row:hover {
        background-color: var(--hover-bg);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
