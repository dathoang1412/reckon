<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Reckon</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        /* Every window manages its own scroll region internally (App's
           list, Popup's content div) — without this, a window whose
           content is even a pixel taller than its viewport shows a second,
           document-level scrollbar stacked next to the intentional one. */
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
