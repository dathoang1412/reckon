<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' data:"
    />
    <title>Reckon</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        /* Every window manages its own scroll region internally (App's
           list, Popup's content div) — without this, a window whose
           content is even a pixel taller than its viewport shows a second,
           document-level scrollbar stacked next to the intentional one. */
        overflow: hidden;
      }

      /* Popup content fades in on each lookup instead of popping in
         instantly — the window itself is shown right after this mounts
         (see windows/popup.ts), so this is the first thing the user sees. */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .fade-in {
        animation: fadeIn 120ms ease-out;
      }

      .entry-row {
        transition: background-color 120ms ease-out;
      }
      .entry-row:hover {
        background-color: #f5f6fa;
      }

      /* antd's message hardcodes placement:'top' deep inside the library
         (no public option to change it) — it always centers itself via
         left:50%/transform:translateX(-50%), regardless of which DOM
         container it's mounted into (a getContainer trick doesn't beat
         this). Overriding the class it always renders with directly is
         the only reliable way to move it. Dropping the transform loses
         the vertical slide-in animation (now just fades via antd's own
         opacity transition) — an acceptable trade for actually landing in
         the corner instead of the still-centered "trick" attempts before. */
      .ant-message {
        top: 24px !important;
        left: auto !important;
        right: 24px !important;
        transform: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
