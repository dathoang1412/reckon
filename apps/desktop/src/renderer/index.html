<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:"
    />
    <title>Reckon</title>
    <style>
      /* antd's own reset.css (which includes this) is never imported, so
         without this every plain element with both an explicit width and
         its own padding/border — e.g. the sidebar column in App.tsx
         (width:220 + paddingLeft:20) — silently renders WIDER than its
         stated width under the browser's content-box default, since
         padding/border add on top instead of eating into it. That
         mismatch between "what the layout math assumes" and "what
         actually renders" is what let the sidebar overflow off the
         window's right edge even at widths that should have been enough. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        /* Every window manages its own scroll region internally (App's
           list, Popup's content div) — without this, a window whose
           content is even a pixel taller than its viewport shows a second,
           document-level scrollbar stacked next to the intentional one. */
        overflow: hidden;
      }

      /* Popup content fades in on each lookup instead of popping in
         instantly — the window itself is shown right after this mounts
         (see windows/popup.ts), so this is the first thing the user sees. */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .fade-in {
        animation: fadeIn 120ms ease-out;
      }

      .entry-row {
        transition: background-color 120ms ease-out;
      }
      .entry-row:hover {
        background-color: #f5f6fa;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
