name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: windows-latest
    # Default GITHUB_TOKEN is read-only on many repos; creating a release
    # needs contents:write explicitly granted here rather than relying on
    # the repo's default Actions permissions setting.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/server/.env is gitignored (it holds the shared Postgres
      # connection string) — the packaged app bundles it verbatim, so the
      # secret has to land there before packaging, not just in the job env.
      - name: Write server .env
        shell: bash
        run: |
          mkdir -p apps/server
          echo "DATABASE_URL=${{ secrets.SERVER_DATABASE_URL }}" > apps/server/.env
          echo "PORT=3000" >> apps/server/.env

      # Neither generated/client directory is committed (they contain a
      # large native query engine binary) — package:desktop packages
      # whatever is on disk, so both must exist before it runs, not just
      # before each side's own build step.
      - name: Generate Prisma clients
        run: |
          pnpm --filter @reckon/server exec prisma generate
          pnpm --filter @reckon/desktop exec prisma generate

      # electron-updater compares the running app's version (baked in at
      # build time from this file) against latest.yml on GitHub Releases —
      # apps/desktop/package.json's committed version never gets bumped
      # per-release, so without this every build would keep reporting the
      # same stale version and auto-update could never detect anything new.
      - name: Set desktop app version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const path = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          " "$VERSION"

      # Exactly the command anyone building this app locally would run
      # (verified end-to-end: produces a working installer) — deliberately
      # NOT hand-duplicated step-by-step here, since the one time this was
      # split into separate steps it drifted from this script's ordering
      # (materialize-shared.cjs vs. the devDependency-reinstall it needs to
      # run after, see .npmrc) and broke in a way local testing didn't
      # catch. Publishes nothing itself — apps/desktop's own "package"
      # script pins --publish never — see the step below for that part.
      - name: Build installer
        run: pnpm package:desktop

      # electron-builder writes latest.yml (the file electron-updater
      # checks) only as part of an actual publish — package:desktop's
      # --publish never above skips generating it entirely, not just the
      # upload. Re-running electron-builder alone (out/ from the previous
      # step is already there, so this doesn't rebuild the renderer) with
      # --publish always and a real token is what actually generates and
      # uploads it alongside the installer.
      #
      # Must stay `pnpm --filter @reckon/desktop exec ...` run from the
      # repo root — NOT `working-directory: apps/desktop` + `pnpm exec`,
      # which pnpm treats as reason to "verify" node_modules against the
      # lockfile and silently reinstalls apps/desktop --production,
      # wiping every devDependency (electron, electron-builder, ...) this
      # step itself needs. See .npmrc.
      - name: Publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @reckon/desktop exec electron-builder --publish always

      # electron-builder's own GitHub publish creates the release with an
      # empty body — this fills it in with the same auto-generated
      # (commits-since-last-tag) notes the old softprops/action-gh-release
      # step used to produce. `gh release edit` has no --generate-notes
      # flag (only `gh release create` does, and the release already
      # exists by this point) — has to go through the REST endpoint that
      # flag calls internally, then apply the result by hand.
      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" \
            --jq .body > release-notes.md
          gh release edit "${{ github.ref_name }}" --notes-file release-notes.md
